services:
  - type: web
    name: resolviq-platform
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: ollama
      - key: LLM_MODEL
        value: qwen3:8b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: "*"
      - key: DOCS_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: INFO
